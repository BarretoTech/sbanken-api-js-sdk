name: ADR compliance

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  adrs:
    name: Validate Code
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: archgate/setup-action@2e1631ad3551f8d044307b1114b414859b0a935f # v1.0.0
        with:
          version: v0.61.0
      - name: Check enterprise ADRs
        run: archgate check --strict --output github
